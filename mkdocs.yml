site_name: vscode-basex
site_description: "About vscode-basex"
site_author: "Andy Bunce"
docs_dir: docs/src/
repo_name: "Quodatum/vscode-basex"
repo_url: "https://github.com/Quodatum/vscode-basex"

nav:
  - Home: index.md
  - Working with XQuery: xquery/index.md
  - Commands: commands.md
  - Settings: settings.md
  - Tags: tags.md
  - Development: dev/build-docs.md
  - About: mkdocs.md

theme:
  name: "material"
  logo: basex.png
  favicon: basex.png

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - admonition
  - pymdownx.details

plugins:
  - tags
  - search
extra:
  version:
    provider: mike
